name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/quickJaso.app build/quickJaso.app.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: quickJaso-app
          path: build/quickJaso.app.zip
          if-no-files-found: error
